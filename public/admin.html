<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#07090d"/><title>LeaseCar.online Admin</title><link rel="stylesheet" href="/styles.css"/><style>
.admin-shell{min-height:100vh;padding:120px max(5vw,20px) 60px}.admin-nav{position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 30px));height:68px;border-radius:20px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.admin-nav .right{display:flex;gap:10px;align-items:center}.tiny-btn{border:1px solid var(--line);background:#11161d;color:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.admin-login{width:min(470px,100%);margin:7vh auto 0;padding:34px;border-radius:28px}.admin-login h1{font-size:45px;letter-spacing:-.05em;margin:10px 0}.admin-login p{color:var(--muted);line-height:1.5}.admin-login label{display:flex;flex-direction:column;gap:8px;margin:14px 0;color:#afb6c0;font-size:12px}.admin-login input,.price-input,.status-select{border:1px solid var(--line);background:#0f141b;color:white;border-radius:13px;padding:14px;outline:none}.dashboard{display:none}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}.dash-head h1{font-size:clamp(44px,6vw,78px);letter-spacing:-.06em;margin:8px 0}.dash-head p{color:var(--muted);max-width:500px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.admin-car{border:1px solid var(--line);border-radius:22px;background:#0d1117;overflow:hidden}.admin-car img{width:100%;height:240px;object-fit:cover;background:#151a20}.admin-car-body{padding:20px}.admin-car h3{margin:0 0 16px;font-size:22px}.edit-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.edit-row label{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--muted)}.save-btn{border:0;background:var(--accent);color:#091008;font-weight:800;padding:14px 16px;border-radius:12px;cursor:pointer}.upload-row{display:flex;gap:10px;align-items:center;margin-top:12px}.file-label{flex:1;border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:12px;font-size:11px;color:#9ca5b0;overflow:hidden}.file-label input{width:100%;margin-top:8px}.admin-status{min-height:18px;margin-top:10px;font-size:11px;color:#a7b0ba}.booking-panel{margin-top:50px}.booking-panel h2{font-size:36px;letter-spacing:-.04em}.bookings{display:grid;gap:10px}.booking{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;background:#0d1117;padding:16px}.booking strong{display:block;margin-bottom:4px}.booking small{color:var(--muted)}.empty{padding:40px;border:1px solid var(--line);border-radius:16px;color:var(--muted)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.booking{grid-template-columns:1fr 1fr}.booking>*:last-child{grid-column:1/-1}.admin-car img{height:210px}}@media(max-width:520px){.booking{grid-template-columns:1fr}.dash-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="noise"></div>
<header class="admin-nav glass"><a class="brand" href="/"><span class="brand-glyph">G</span><span>LeaseCar.online</span></a><div class="right"><span id="adminEmail" style="font-size:11px;color:#929aa7"></span><button class="tiny-btn" id="logoutBtn" hidden>Log out</button><a class="tiny-btn" href="/">View site ↗</a></div></header>
<main class="admin-shell"><section class="admin-login glass" id="loginPanel"><span class="kicker">SECURE ACCESS</span><h1>Admin login.</h1><p>Manage the live price and photo for all six LeaseCar.online cars.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" required autocomplete="username"/></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"/></label><button class="primary" type="submit" style="width:100%;margin-top:10px">Enter dashboard →</button><div class="admin-status" id="loginStatus"></div></form></section>
<section class="dashboard" id="dashboard"><div class="dash-head"><div><span class="kicker">CONTROL ROOM</span><h1>Live fleet.</h1></div><p>Every saved price or uploaded photo becomes the source of truth for the public website immediately.</p></div><div class="admin-grid" id="adminGrid"></div><section class="booking-panel"><span class="kicker">RENTAL REQUESTS</span><h2>Latest enquiries</h2><div class="bookings" id="bookings"></div></section></section></main>
<script type="module" src="/admin.js"></script></body></html>
